services:
  testproject-postgres:
    image: postgres:16-alpine
    container_name: testproject-postgres
    environment:
      POSTGRES_DB: demo_login
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"
    volumes:
      - testproject-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d demo_login"]
      interval: 5s
      timeout: 3s
      retries: 12

  testproject-redis:
    image: redis:7-alpine
    container_name: testproject-redis
    ports:
      - "56379:6379"
    volumes:
      - testproject-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  testproject-postgres-data:
  testproject-redis-data:
