spring.application.name=Demo

server.port=8081

spring.app.jwtSecret=Aak-myBoyfriend-is-very-cute
spring.app.jwtExpirationMs=900000 
spring.app.jwtRefreshExpirationMs=86400000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true


spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:55432/demo_login}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:56379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}
